name: Release

# Builds and attests the release zip for a vMAJOR.MINOR.PATCH tag with memo33/sc4-dll-actions, and
# leaves it in a draft release. See "Releases" in the README.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tags look like v1.0.0 or v1.0.0-rc.1, not $TAG_NAME"
            exit 1
          fi

      - name: Require a public repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::Attestations need a public repository"
          exit 1

  build:
    needs: check
    # Head of its v1 branch on 2026-11-22. Change --signer-digest in the README with the pin.
    uses: memo33/sc4-dll-actions/.github/workflows/attested-build.yaml@c7aa3d2d748a9bd52a573a79f1f6ba78dde6f25f
    with:
      build-os: windows-2022
      build-script: |
        $PSNativeCommandUseErrorActionPreference = $true
        # The checkout is shallow: the version comes from git describe, and vcpkg needs its history.
        if ((git rev-parse --is-shallow-repository) -eq 'true') { git fetch --unshallow --tags --no-recurse-submodules }
        if ((git -C vendor/vcpkg rev-parse --is-shallow-repository) -eq 'true') { git -C vendor/vcpkg fetch --unshallow }
        .\vendor\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        cmake --preset vs2022-win32-release
        cmake --build --preset vs2022-win32-release-build --parallel

        $dll = 'cmake-build-release-visual-studio/src/dll/Release/SC4SeamlessRegion.dll'
        if (-not (Test-Path $dll)) { throw "$dll is missing" }
        $out = New-Item -ItemType Directory -Force -Path release-package
        Copy-Item $dll, dist/SC4SeamlessRegion.ini, README.md, LICENSE.txt, THIRD_PARTY_NOTICES.txt -Destination $out
        Copy-Item vendor/gzcom-dll/LICENSE (Join-Path $out 'LICENSE-gzcom-dll')
        Copy-Item vendor/sc4-dll-utilities/LICENSE.txt (Join-Path $out 'LICENSE-sc4-dll-utilities.txt')
        Copy-Item vendor/sc4-render-services/LICENSE.txt (Join-Path $out 'LICENSE-sc4-render-services.txt')
        python tools/make-sbom.py --dll $dll --version '${{ github.ref_name }}' --output (Join-Path $out 'SC4SeamlessRegion.spdx.json')
        # LF line endings, so sha256sum -c reads it on any system.
        $sums = Get-ChildItem -File $out | Get-FileHash -Algorithm SHA256 |
          ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)`n" }
        [IO.File]::WriteAllText((Join-Path $out.FullName 'SHA256SUMS.txt'), -join $sums)
      build-output: release-package
      artifact-name: SC4SeamlessRegion-${{ github.ref_name }}-win32.zip
      attestation-subject-path: SC4SeamlessRegion.dll
      prerelease: ${{ contains(github.ref_name, '-') }}
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
