[SC4SeamlessRegion]
; trace, debug, info, warn, error, critical or off
LogLevel=info
LogToFile=true
; Show the Seamless Region panel when the game starts. Ctrl+Shift+F9 shows and hides it.
StartWindowVisible=true

; Master switch. When false the plugin does nothing. Takes effect at the next start.
Enabled=true
; Draw the neighbor cities around the city you play
ShowNeighbors=true
; Also draw neighbors that are in front of the city
ShowFrontNeighbors=true
; Tint the neighbor under the pointer
HoverTint=true
; Double-click a neighbor to save this city and play the neighbor
ClickToSwitch=true
; Render the city again after every save. A quick save (Ctrl+Alt+S) does not start a render.
RenderOnSave=false
; Render cities at noon, so all neighbors look the same at any time of day: noon light, the
; game's day mode (no lit windows) and time of day props at noon
CaptureAtNoon=true
; Keep the sun glare on water in renders. It leaves hard seams between cities
CaptureWaterGlare=false
; Keep the terrain grid in renders when it is on in the game. false: renders never show it
CaptureTerrainGrid=false
; Keep the cliff on the two front edges of each city in renders, so a height step between
; neighbors shows a cliff, not the background. false: transparent edges
CaptureEdgeWalls=true
; Redraw only the tiles on the city edge for their second key color, not the whole window.
; Faster. false: the whole window, as in older versions
CapturePartialRedraw=true
; With SCD3D11 (its async snapshot extension): draw the next block while the screen copy of the one
; before is on the way. Other drivers read as before. false: always read at once
CaptureAsyncReadback=true
; Render every city at one date: seasonal props (on lots and painted) show the state of
; CaptureMonth (1 to 12) and CaptureDay. The city's own date is not changed. Mid-season dates
; keep all packs in one season: spring 4/15, summer 7/15, fall 10/15, winter 1/15
CaptureAtDate=false
CaptureMonth=6
CaptureDay=1
; With CaptureAtDate: seasonal trees show the season of CaptureMonth (planted on September 1st,
; the standard for seasonal flora). Slower in cities with very many trees
CaptureSeasonalFlora=true
; With CaptureAtDate: keep one render per season next to the main render, so neighbors show the
; season of your city's date. Uses more disk space. false: one render per city, at the date
CaptureSeasonSlots=false
; Render like the game's region thumbnail (flat water). For tests only
CaptureSnapshotFlag=false
; Also render the transport view of the game: roads, rails and zones as colored lines on the
; terrain, like the transport map of the region view. The region map can then show it. A render
; takes more time
CaptureTransportLayer=false
; The highest zoom a render makes: 3, 4 or 5. Zoom 5 is the most detail, but it takes about
; 4 times the time and disk space of zoom 4. Zoom 3 is fastest. Then neighbors do not show at
; zoom 4 and 5
MaxRenderZoom=4
; The rotations a render makes. A neighbor shows only in the rotations it has a render for.
; Each rotation takes a quarter of the render time. Rotation 1 is the view a city opens in
RenderRotation1=true
RenderRotation2=true
RenderRotation3=true
RenderRotation4=true
; Region render: save each city it opened before it moves on to the next. false (default):
; those cities close without a save (the game is paused during their render, nothing is lost),
; about 3 seconds faster each. The city the run started in is always saved
BatchSaveCities=false
; Video memory for neighbor tiles, in megabytes (16 to 1024)
TileCacheMB=512
; Upload at most this many tiles per frame (1 to 64)
UploadTilesPerFrame=16
; Or spend at most this many milliseconds per frame on uploads (1 to 50)
UploadMsPerFrame=12
; At zoom 4 and 5, scroll at most this many metres past the city edge
Zoom45BandMetres=1024
; Quality of the stored tiles, 0 to 100
WebpQuality=82

; Region map export: quality of the map tiles, 0 to 100
MapQuality=75
; Region map export: memory for city tiles, in megabytes (8 to 48)
MapCacheMB=32
; Region map export: zoom levels past full size, shown enlarged (0 to 3)
MapUpscaleLevels=1
