[SC4SeamlessRegion]
; trace, debug, info, warn, error, critical or off
LogLevel=info
LogToFile=true
; Show the Seamless Region panel when the game starts. Ctrl+Shift+F9 shows and hides it.
StartWindowVisible=true

; Master switch. When false the plugin does nothing. Takes effect at the next start.
Enabled=true
; Draw the neighbor cities around the city you play
ShowNeighbors=true
; Also draw neighbors that are in front of the city
ShowFrontNeighbors=true
; Tint the neighbor under the pointer
HoverTint=true
; Click a neighbor to save this city and play the neighbor
ClickToSwitch=true
; Render the city again after every save
RenderOnSave=false
; Render cities with noon light, so all neighbors look the same at any time of day
CaptureAtNoon=true
; Keep the sun glare on water in renders. It leaves hard seams between cities
CaptureWaterGlare=false
; Render like the game's region thumbnail (flat water). For tests only
CaptureSnapshotFlag=false
; The highest zoom a render makes: 3, 4 or 5. Zoom 5 is the most detail, but it takes about
; 4 times the time and disk space of zoom 4. Zoom 3 is fastest. Then neighbors do not show at
; zoom 4 and 5
MaxRenderZoom=4
; Video memory for neighbor tiles, in megabytes (16 to 1024)
TileCacheMB=96
; Upload at most this many tiles per frame (1 to 64)
UploadTilesPerFrame=4
; Or spend at most this many milliseconds per frame on uploads (1 to 50)
UploadMsPerFrame=3
; At zoom 4 and 5, scroll at most this many metres past the city edge
Zoom45BandMetres=1024
; Quality of the stored tiles, 0 to 100
WebpQuality=82

; Region map export: quality of the map tiles, 0 to 100
MapQuality=75
; Region map export: memory for city tiles, in megabytes (8 to 48)
MapCacheMB=32
; Region map export: zoom levels past full size, shown enlarged (0 to 3)
MapUpscaleLevels=1
